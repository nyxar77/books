<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const hash = window.location.hash;
    const d1 = '#red@';
    const d2 = '#redirect@';

    const activeDelimiter = hash.startsWith(d1) ? d1 : (hash.startsWith(d2) ? d2 : null);

    if (activeDelimiter) {
      try {
        const urlPart = hash.split(activeDelimiter)[1];

        if (urlPart && urlPart.trim() !== "") {
          const destination = `https://${decodeURIComponent(urlPart)}`;

          window.location.replace(destination);
        } else {
          trigger404();
        }
      } catch (e) {
        trigger404();
      }
    } else {
      trigger404();
    }

    function trigger404() {
      window.addEventListener('DOMContentLoaded', () => {
        document.title = "404 - Not Found";
        document.body.innerHTML = `
          <div class="loader">
            <h1>404</h1>
            <p>The page you are looking for does not exist.</p>
            <a href="/">Go Home</a>
          </div>`;
      });
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f9;
    }

    .loader {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #333;
    }

    a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="loader">
    <h2>Redirecting...</h2>
    <p>If you are not redirected, <a id="manual-link" href="#">click here</a>.</p>
  </div>
</body>

</html>
